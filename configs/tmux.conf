# 手动加入 ~/.tmux.conf；Oh My Tmux 用户加入 ~/.tmux.conf.local。
# 需要 tmux 3.2+，以及 wl-clipboard（Wayland）或 xclip（X11）。

set -g mouse on
set -g set-clipboard on

# 统一指定系统剪贴板命令。
if-shell '[ -n "$WAYLAND_DISPLAY" ]' \
  'set -s copy-command "wl-copy"' \
  'set -s copy-command "xclip -selection clipboard -in >/dev/null 2>&1"'

# 鼠标拖选后松开或按 y，使用 copy-command 复制。
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
