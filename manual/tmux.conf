# 手动加入到 `~/.tmux.conf` 或 `~/.tmux.conf.local`
# 需要先安装 xclip 或 wl-clipboard。

# 鼠标支持
set -g mouse on

# 允许终端剪贴板与 tmux 剪贴板同步
set -g set-clipboard on

# Wayland 使用 wl-copy；X11 使用 xclip。
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"; bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "wl-copy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"; bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'
